<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contact Quick Editor</title>

    <!-- Zoho CRM Embedded App SDK -->
    <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>

    <!-- Widget Styles -->
    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- =====================================================
         PAGE HEADER
    ====================================================== -->

    <div class="page-header">

        <h1>
            Contact Quick Editor
        </h1>

        <p>
            View and update Contact information
        </p>

    </div>


    <!-- =====================================================
         STATUS MESSAGE
    ====================================================== -->

    <div
        id="statusMessage"
        class="status-message"
    >
    </div>


    <!-- =====================================================
         CONTACT INFORMATION
    ====================================================== -->

    <div class="card">

        <h2>
            Contact Information
        </h2>

        <p>
            Edit the Contact details below.
        </p>


        <div class="form-grid">

            <!-- First Name -->

            <div class="form-group">

                <label for="firstName">
                    First Name
                </label>

                <input
                    type="text"
                    id="firstName"
                    placeholder="Enter first name"
                >

            </div>


            <!-- Last Name -->

            <div class="form-group">

                <label for="lastName">
                    Last Name *
                </label>

                <input
                    type="text"
                    id="lastName"
                    placeholder="Enter last name"
                >

            </div>


            <!-- Phone -->

            <div class="form-group">

                <label for="phone">
                    Phone
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter phone number"
                >

            </div>


            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter email address"
                >

            </div>

        </div>


        <!-- Save Contact -->

        <button
            type="button"
            id="saveContactBtn"
        >
            Save Contact
        </button>

    </div>


    <!-- =====================================================
         MAILING ADDRESS
    ====================================================== -->

    <div class="card">

        <h2>
            Mailing Address
        </h2>

        <p>
            Enter a postal code to automatically find the
            city, state and country.
        </p>


        <!-- Postal Code -->

        <div class="form-group">

            <label for="postalCode">
                Postal Code
            </label>

            <input
                type="text"
                id="postalCode"
                placeholder="Enter U.S. ZIP code"
            >

        </div>


        <!-- Lookup Address -->

        <button
            type="button"
            id="lookupAddressBtn"
            class="secondary-button lookup-button"
        >
            Lookup Address
        </button>


        <!-- Address Fields -->

        <div class="form-group">

            <label for="streetAddress">
                Street Address
            </label>

            <textarea
                id="streetAddress"
                rows="3"
                placeholder="Enter street address"
            ></textarea>

        </div>


        <div class="address-grid">

            <!-- City -->

            <div class="form-group">

                <label for="city">
                    City
                </label>

                <input
                    type="text"
                    id="city"
                    placeholder="City"
                >

            </div>


            <!-- State -->

            <div class="form-group">

                <label for="state">
                    State / Province
                </label>

                <input
                    type="text"
                    id="state"
                    placeholder="State / Province"
                >

            </div>


            <!-- Country -->

            <div class="form-group">

                <label for="country">
                    Country
                </label>

                <input
                    type="text"
                    id="country"
                    placeholder="Country"
                >

            </div>

        </div>


        <!-- Save Address -->

        <button
            type="button"
            id="saveAddressBtn"
        >
            Save Address
        </button>

    </div>


    <!-- =====================================================
         APPLICATION JAVASCRIPT
    ====================================================== -->

    <script src="app.js"></script>

</body>

</html>
