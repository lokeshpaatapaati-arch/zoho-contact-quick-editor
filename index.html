```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Quick Editor</title>

    <!-- Widget CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Zoho CRM Embedded App SDK -->
    <script src="https://static.zohocdn.com/crm/sdk/1.0/ZohoEmbededAppSDK.min.js"></script>
</head>

<body>

    <div class="widget-container">

        <!-- ================================
             WIDGET HEADER
        ================================= -->

        <header class="widget-header">

            <div>
                <h1>Contact Quick Editor</h1>

                <p>
                    View and update contact information
                </p>
            </div>

        </header>


        <!-- ================================
             LOADING STATE
        ================================= -->

        <div id="loadingState" class="loading-state">

            <div class="loading-spinner"></div>

            <span>
                Loading contact information...
            </span>

        </div>


        <!-- ================================
             MAIN CONTENT
        ================================= -->

        <main id="mainContent" class="hidden">


            <!-- ================================
                 CONTACT INFORMATION SECTION
            ================================= -->

            <section class="card">

                <div class="section-header">

                    <div>

                        <h2>Contact Information</h2>

                        <p>
                            Update the contact's core details.
                        </p>

                    </div>

                </div>


                <div class="form-grid">


                    <!-- First Name -->

                    <div class="form-group">

                        <label for="firstName">
                            First Name
                        </label>

                        <input
                            type="text"
                            id="firstName"
                            name="firstName"
                            placeholder="Enter first name"
                            autocomplete="given-name"
                        >

                    </div>


                    <!-- Last Name -->

                    <div class="form-group">

                        <label for="lastName">
                            Last Name
                            <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="lastName"
                            name="lastName"
                            placeholder="Enter last name"
                            autocomplete="family-name"
                            required
                        >

                    </div>


                    <!-- Phone -->

                    <div class="form-group">

                        <label for="phone">
                            Phone
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter phone number"
                            autocomplete="tel"
                        >

                    </div>


                    <!-- Email -->

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter email address"
                            autocomplete="email"
                        >

                    </div>

                </div>


                <!-- Contact Save -->

                <div class="form-actions">

                    <button
                        type="button"
                        id="saveContactBtn"
                        class="primary-button"
                    >
                        Save Changes
                    </button>

                </div>

            </section>



            <!-- ================================
                 ADDRESS SECTION
            ================================= -->

            <section class="card">

                <div class="section-header">

                    <div>

                        <h2>Address</h2>

                        <p>
                            Enter a postal code to automatically
                            find location details.
                        </p>

                    </div>

                </div>


                <!-- Postal Code Lookup -->

                <div class="postal-row">

                    <div class="form-group postal-field">

                        <label for="postalCode">
                            Postal Code
                        </label>

                        <input
                            type="text"
                            id="postalCode"
                            name="postalCode"
                            placeholder="Enter postal code"
                            autocomplete="postal-code"
                        >

                    </div>


                    <button
                        type="button"
                        id="lookupAddressBtn"
                        class="secondary-button"
                    >
                        Lookup
                    </button>

                </div>


                <!-- Address Fields -->

                <div class="form-grid">


                    <!-- Street Address -->

                    <div class="form-group full-width">

                        <label for="streetAddress">
                            Street Address
                        </label>

                        <input
                            type="text"
                            id="streetAddress"
                            name="streetAddress"
                            placeholder="Enter street address"
                            autocomplete="street-address"
                        >

                        <span class="field-help">
                            Street address must be entered manually.
                        </span>

                    </div>


                    <!-- City -->

                    <div class="form-group">

                        <label for="city">
                            City
                        </label>

                        <input
                            type="text"
                            id="city"
                            name="city"
                            placeholder="City"
                            autocomplete="address-level2"
                        >

                    </div>


                    <!-- State / Province -->

                    <div class="form-group">

                        <label for="state">
                            State / Province
                        </label>

                        <input
                            type="text"
                            id="state"
                            name="state"
                            placeholder="State / Province"
                            autocomplete="address-level1"
                        >

                    </div>


                    <!-- Country -->

                    <div class="form-group">

                        <label for="country">
                            Country
                        </label>

                        <input
                            type="text"
                            id="country"
                            name="country"
                            placeholder="Country"
                            autocomplete="country-name"
                        >

                    </div>

                </div>


                <!-- Address Save -->

                <div class="form-actions">

                    <button
                        type="button"
                        id="saveAddressBtn"
                        class="primary-button"
                    >
                        Save Address
                    </button>

                </div>

            </section>


        </main>


        <!-- ================================
             STATUS MESSAGE
        ================================= -->

        <div
            id="statusMessage"
            class="status-message hidden"
            role="alert"
            aria-live="polite"
        ></div>


    </div>


    <!-- Widget JavaScript -->

    <script src="app.js"></script>

</body>
</html>
```
